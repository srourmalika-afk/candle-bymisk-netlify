<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>candle_bymisk — Tous nos produits</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #f5f0e8;
      --warm-white: #faf7f2;
      --sand: #e2d5be;
      --clay: #c4a882;
      --bark: #8b6f47;
      --earth: #5c4429;
      --smoke: #9e9488;
      --charcoal: #2e2720;
      --accent: #c17f3e;
    }
    body {
      font-family: 'Jost', sans-serif;
      background: #fdf1f3;
      color: var(--charcoal);
    }
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 3rem;
      background: rgba(255,249,250,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #fae3e8;
    }
    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: #7a3b48;
      text-decoration: none;
    }
    .nav-logo span { font-style: italic; color: #c1607a; }
    .back-link {
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #a3717d;
      text-decoration: none;
    }
    .nav-icons {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .cart-btn {
      position: relative;
      background: none;
      border: none;
      cursor: pointer;
      color: #7a3b48;
      display: flex;
      align-items: center;
    }
    .cart-btn svg { width: 22px; height: 22px; }
    .cart-badge {
      display: none;
      position: absolute;
      top: -6px; right: -8px;
      background: #c1607a;
      color: #fff;
      font-size: 0.65rem;
      width: 17px; height: 17px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
    }
    .page-header {
      margin-top: 80px;
      padding: 3rem 3rem 1rem;
      text-align: center;
    }
    .page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 300;
      color: #7a3b48;
    }
    .page-header h1 em { font-style: italic; color: #c1607a; }
    .shop {
      padding: 2rem 3rem 4rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    #message {
      text-align: center;
      color: var(--smoke);
      font-style: italic;
      padding: 3rem;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }
    .product-card {
      background: white;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(92,68,41,0.08);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 24px rgba(92,68,41,0.15);
    }
    .product-img {
      width: 100%;
      aspect-ratio: 1;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }
    .product-info { padding: 1.2rem; }
    .product-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--earth);
      margin-bottom: 0.4rem;
    }
    .product-desc {
      font-size: 0.82rem;
      color: var(--smoke);
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .product-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--accent);
    }
    .product-stock {
      font-size: 0.72rem;
      color: var(--smoke);
      letter-spacing: 0.08em;
    }
    .product-stock.low { color: #c05555; }
    .size-selector {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }
    .size-btn {
      flex: 1;
      padding: 0.4rem;
      font-size: 0.75rem;
      font-family: 'Jost', sans-serif;
      border: 1px solid var(--sand);
      background: var(--cream);
      color: var(--earth);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .size-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.85);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--earth);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .carousel-arrow:hover { background: var(--accent); color: white; }
    .carousel-arrow.prev { left: 8px; }
    .carousel-arrow.next { right: 8px; }
    .carousel-dots {
      position: absolute;
      bottom: 8px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 5px;
      z-index: 2;
    }
    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: background 0.2s;
    }
    .carousel-dot.active { background: var(--accent); }
    footer {
      background: var(--charcoal);
      text-align: center;
      padding: 2rem;
      color: var(--smoke);
      font-size: 0.82rem;
      margin-top: 4rem;
    }
    footer span { color: var(--accent); font-family: 'Cormorant Garamond', serif; font-style: italic; }
    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--clay);
      font-style: italic;
    }
    .add-to-cart-btn {
      width: 100%;
      margin-top: 0.8rem;
      padding: 0.6rem;
      background: #c1607a;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: 'Jost', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-to-cart-btn:hover { background: #a94d64; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(46,39,32,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 10px;
      max-width: 460px;
      width: 100%;
      padding: 2rem;
      position: relative;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: none;
      border: none;
      font-size: 1.3rem;
      color: var(--smoke);
      cursor: pointer;
      line-height: 1;
    }
    .modal-box h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      color: #7a3b48;
      margin-bottom: 1.2rem;
    }
    .cart-empty { color: var(--smoke); font-style: italic; font-size: 0.85rem; }
    .cart-item {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      padding: 0.7rem 0;
      border-bottom: 1px solid #f3e0e4;
    }
    .cart-item-img {
      width: 54px; height: 54px;
      border-radius: 6px;
      overflow: hidden;
      background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-size: 0.85rem; color: var(--earth); margin-bottom: 0.2rem; }
    .cart-item-price { font-size: 0.78rem; color: var(--accent); margin-bottom: 0.3rem; }
    .cart-qty {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .cart-qty button {
      width: 22px; height: 22px;
      border: 1px solid var(--sand);
      background: white;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
    }
    .cart-qty span { font-size: 0.85rem; }
    .cart-item-remove {
      background: none;
      border: none;
      color: var(--smoke);
      cursor: pointer;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .cart-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      font-size: 1rem;
      color: #7a3b48;
      border-top: 1px solid #f3e0e4;
      margin-top: 0.5rem;
    }
    #cartFormWrap { display: none; }
    #cartFormWrap label {
      display: block;
      font-size: 0.78rem;
      color: #7a3b48;
      margin: 0.7rem 0 0.3rem;
    }
    #cartFormWrap input, #cartFormWrap textarea {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--sand);
      border-radius: 4px;
      font-family: 'Jost', sans-serif;
      font-size: 0.85rem;
    }
    .delivery-zone {
      border: 1px solid var(--sand);
      border-radius: 6px;
      padding: 0.8rem 1rem;
      margin-top: 0.8rem;
    }
    .delivery-zone legend {
      font-size: 0.78rem;
      color: #7a3b48;
      padding: 0 0.3rem;
    }
    .delivery-zone label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--charcoal);
      padding: 0.4rem 0;
      cursor: pointer;
    }
    .delivery-zone input[type="radio"] { width: auto; accent-color: #c1607a; }
    .submit-order-btn {
      width: 100%;
      margin-top: 1.2rem;
      padding: 0.7rem;
      background: #7a3b48;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      cursor: pointer;
    }
    .submit-order-btn:hover { background: #632e39; }
    .whatsapp-float {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      width: 54px; height: 54px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      z-index: 150;
      text-decoration: none;
    }
    .whatsapp-float svg { width: 28px; height: 28px; fill: #fff; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">candle_<span>bymisk</span></a>
    <div class="nav-icons">
      <a href="index.html" class="back-link">← Retour à l'accueil</a>
      <button type="button" class="cart-btn" onclick="openCart()" aria-label="Panier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span class="cart-badge">0</span>
      </button>
    </div>
  </nav>

  <section class="page-header">
    <h1>Tous nos <em>produits</em></h1>
  </section>

  <section class="shop">
    <div id="message" class="loading">Chargement des produits...</div>
    <div class="product-grid" id="productGrid"></div>
  </section>

  <footer>
    © 2026 candle_<span>bymisk</span> — Fait avec 🕯️ au Maroc
  </footer>

  <div class="modal-overlay" id="cartModal">
    <div class="modal-box">
      <button type="button" class="modal-close" onclick="closeCart()">✕</button>
      <h2>Votre panier</h2>
      <div id="cartItems"></div>
      <div class="cart-total-row" style="border-top:none; padding-bottom:0;">
        <span>Sous-total</span>
        <span id="cartSubtotal">0 dh</span>
      </div>
      <div class="cart-total-row" style="border-top:none; padding-top:0;">
        <span>Livraison</span>
        <span id="cartShipping">—</span>
      </div>
      <div class="cart-total-row">
        <span>Total</span>
        <strong id="cartTotal">0 dh</strong>
      </div>
      <div id="cartFormWrap">
        <form name="commande" method="POST" data-netlify="true" netlify-honeypot="bot-field" onsubmit="submitOrder(event)">
          <input type="hidden" name="form-name" value="commande">
          <p style="display:none;"><label>Ne pas remplir : <input name="bot-field"></label></p>
          <label for="nom2">Nom complet</label>
          <input type="text" id="nom2" name="nom" required>
          <label for="telephone2">Téléphone</label>
          <input type="tel" id="telephone2" name="telephone" required>
          <label for="adresse2">Adresse</label>
          <input type="text" id="adresse2" name="adresse" required>
          <label for="ville2">Ville</label>
          <input type="text" id="ville2" name="ville" required>
          <fieldset class="delivery-zone">
            <legend>Zone de livraison</legend>
            <label><input type="radio" name="zone" value="casablanca" checked onchange="updateShippingDisplay()"> Casablanca — 20 dh</label>
            <label><input type="radio" name="zone" value="autre" onchange="updateShippingDisplay()"> Reste du Maroc — 35 dh</label>
            <p style="font-size:0.72rem; color:#a3717d; margin-top:0.5rem; padding-top:0.5rem; border-top:1px solid var(--sand);">✦ Livraison gratuite dès 199 dh d'achat</p>
          </fieldset>
          <input type="hidden" name="commande">
          <input type="hidden" name="frais_livraison">
          <input type="hidden" name="total">
          <button type="submit" class="submit-order-btn">Passer la commande</button>
        </form>
      </div>
    </div>
  </div>

  <a href="https://wa.me/212772141717" target="_blank" rel="noopener" class="whatsapp-float" aria-label="Nous contacter sur WhatsApp">
    <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2Zm5.8 14.15c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.81-.11-.42-.13-.95-.3-1.64-.6-2.88-1.24-4.76-4.14-4.9-4.33-.14-.2-1.17-1.55-1.17-2.96 0-1.4.74-2.09 1-2.38.26-.29.58-.36.77-.36h.55c.18 0 .42-.07.65.5.24.58.82 2 .89 2.14.07.14.12.31.02.5-.1.19-.15.31-.29.48-.14.17-.3.37-.43.5-.14.14-.29.29-.13.57.17.29.75 1.24 1.61 2 1.11.99 2.04 1.3 2.33 1.44.29.14.46.12.63-.07.17-.19.72-.84.91-1.13.19-.29.38-.24.63-.14.26.1 1.65.78 1.93.92.29.14.48.21.55.33.07.12.07.68-.17 1.36Z"/></svg>
  </a>

  <script>
    fetch('/.netlify/functions/products')
      .then(res => res.json())
      .then(products => {
        const msg = document.getElementById('message');
        const grid = document.getElementById('productGrid');

        if (products.length === 0) {
          msg.textContent = 'Aucun produit disponible pour le moment.';
          return;
        }

        msg.style.display = 'none';

        grid.innerHTML = products.map((p, idx) => {
          const hasSizes = p.sizes && p.sizes.length > 0;
          const hasGallery = p.images && p.images.length > 1;
          const first = hasSizes ? p.sizes[0] : null;
          const initialImg = hasSizes ? first.imageUrl : (hasGallery ? p.images[0] : p.imageUrl);
          const initialPrice = hasSizes ? first.price : p.price;

          const sizeButtons = hasSizes ? `
            <div class="size-selector">
              ${p.sizes.map((s, i) => `
                <button type="button" class="size-btn ${i === 0 ? 'active' : ''}"
                  onclick="selectSize(${idx}, ${i})">${s.label}</button>
              `).join('')}
            </div>
          ` : '';

          const carouselControls = hasGallery ? `
            <button type="button" class="carousel-arrow prev" onclick="event.stopPropagation(); shiftImage(${idx}, -1)">‹</button>
            <button type="button" class="carousel-arrow next" onclick="event.stopPropagation(); shiftImage(${idx}, 1)">›</button>
            <div class="carousel-dots">
              ${p.images.map((_, i) => `
                <span class="carousel-dot ${i === 0 ? 'active' : ''}" onclick="event.stopPropagation(); goToImage(${idx}, ${i})"></span>
              `).join('')}
            </div>
          ` : '';

          return `
          <div class="product-card">
           <div class="product-img" id="img-${idx}" style="position:relative;" onclick="if(event.target.tagName!=='BUTTON' && !event.target.closest('button')) window.location.href='produit.html?id='+encodeURIComponent('${p._id}')">
  ${initialImg 
    ? `<img src="${initialImg}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;">` 
    : '🕯️'}
  ${carouselControls}
</div>
            <div class="product-info">
              <h3 class="product-name">${p.name}</h3>
              <p class="product-desc">${p.description || 'Bougie artisanale marocaine'}</p>
              ${sizeButtons}
              <div class="product-footer">
                <span class="product-price" id="price-${idx}">${initialPrice} dh</span>
                <span class="product-stock ${p.stock <= 3 ? 'low' : ''}">
                  ${p.stock <= 3 ? '⚠️ ' : ''}Stock : ${p.stock}
                </span>
              </div>
              <button type="button" class="add-to-cart-btn" onclick="event.stopPropagation(); addToCartFromCard(${idx})">Ajouter au panier</button>
            </div>
          </div>
        `;
        }).join('');

        window.productsData = products;
      })
      .catch(() => {
        document.getElementById('message').textContent = '⚠️ Impossible de charger les produits. Vérifiez que le serveur est démarré.';
      });

    window.carouselState = {};

    function renderCarouselImage(productIdx) {
      const product = window.productsData[productIdx];
      const state = window.carouselState[productIdx] || 0;
      const imgContainer = document.getElementById(`img-${productIdx}`);
      const existingImg = imgContainer.querySelector('img');
      if (existingImg) existingImg.src = product.images[state];

      const dots = imgContainer.querySelectorAll('.carousel-dot');
      dots.forEach((dot, i) => dot.classList.toggle('active', i === state));
    }

    function shiftImage(productIdx, direction) {
      const product = window.productsData[productIdx];
      const total = product.images.length;
      const current = window.carouselState[productIdx] || 0;
      window.carouselState[productIdx] = (current + direction + total) % total;
      renderCarouselImage(productIdx);
    }

    function goToImage(productIdx, imgIdx) {
      window.carouselState[productIdx] = imgIdx;
      renderCarouselImage(productIdx);
    }

    function selectSize(productIdx, sizeIdx) {
      const product = window.productsData[productIdx];
      const size = product.sizes[sizeIdx];

      document.getElementById(`img-${productIdx}`).innerHTML =
        `<img src="${size.imageUrl}" alt="${product.name}" style="width:100%;height:100%;object-fit:cover;">`;
      document.getElementById(`price-${productIdx}`).textContent = `${size.price} dh`;

      const card = document.getElementById(`img-${productIdx}`).closest('.product-card');
      card.querySelectorAll('.size-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === sizeIdx);
      });
    }
  </script>
  <script src="cart.js"></script>
</body>
</html>
