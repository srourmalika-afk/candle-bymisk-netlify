<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>candle_bymisk — Boutique</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #f5f0e8;
      --warm-white: #faf7f2;
      --sand: #e2d5be;
      --clay: #c4a882;
      --bark: #8b6f47;
      --earth: #5c4429;
      --smoke: #9e9488;
      --charcoal: #2e2720;
      --accent: #c17f3e;
    }
    body {
      font-family: 'Jost', sans-serif;
      background: #fdf1f3;
      color: var(--charcoal);
    }
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 3rem;
      background: rgba(255,249,250,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #fae3e8;
    }
    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: #7a3b48;
      text-decoration: none;
    }
    .nav-logo span { font-style: italic; color: #c1607a; }
    .hero {
      margin-top: 80px;
      padding: 5rem 3rem 3rem;
      text-align: center;
      background: #fdedf0;
    }
    .hero-eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #b56575;
      margin-bottom: 1rem;
    }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 300;
      color: #7a3b48;
      margin-bottom: 0.8rem;
    }
    .hero h1 em { font-style: italic; color: #c1607a; }
    .hero p {
      font-size: 0.9rem;
      color: #a3717d;
      max-width: 500px;
      margin: 0 auto;
    }
    .shop {
      padding: 4rem 3rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    #message {
      text-align: center;
      color: var(--smoke);
      font-style: italic;
      padding: 3rem;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }
    .product-card {
      background: white;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(92,68,41,0.08);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 24px rgba(92,68,41,0.15);
    }
    .product-img {
      width: 100%;
      aspect-ratio: 1;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }
    .product-info { padding: 1.2rem; }
    .product-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--earth);
      margin-bottom: 0.4rem;
    }
    .product-desc {
      font-size: 0.82rem;
      color: var(--smoke);
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .product-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--accent);
    }
    .product-stock {
      font-size: 0.72rem;
      color: var(--smoke);
      letter-spacing: 0.08em;
    }
    .product-stock.low { color: #c05555; }
    .size-selector {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }
    .size-btn {
      flex: 1;
      padding: 0.4rem;
      font-size: 0.75rem;
      font-family: 'Jost', sans-serif;
      border: 1px solid var(--sand);
      background: var(--cream);
      color: var(--earth);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .size-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.85);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--earth);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .carousel-arrow:hover { background: var(--accent); color: white; }
    .carousel-arrow.prev { left: 8px; }
    .carousel-arrow.next { right: 8px; }
    .carousel-dots {
      position: absolute;
      bottom: 8px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 5px;
      z-index: 2;
    }
    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: background 0.2s;
    }
    .carousel-dot.active { background: var(--accent); }
    footer {
      background: var(--charcoal);
      text-align: center;
      padding: 2rem;
      color: var(--smoke);
      font-size: 0.82rem;
      margin-top: 4rem;
    }
    footer span { color: var(--accent); font-family: 'Cormorant Garamond', serif; font-style: italic; }
    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--clay);
      font-style: italic;
    }
  </style>
</head>
<body>

  <nav>
    <a href="#" class="nav-logo">candle_<span>bymisk</span></a>
    <span style="font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:#a3717d">✦ Bougies Artisanales</span>
  </nav>

  <section class="hero">
    <p class="hero-eyebrow">✦ Collection Artisanale</p>
    <h1>Nos <em>bougies</em></h1>
    <p>Chaque bougie est façonnée à la main avec des cires naturelles et des huiles essentielles.</p>
  </section>

  <section class="shop">
    <div id="message" class="loading">Chargement des produits...</div>
    <div class="product-grid" id="productGrid"></div>
  </section>

  <footer>
    © 2026 candle_<span>bymisk</span> — Fait avec 🕯️ au Maroc
  </footer>

  <script>
    fetch('/.netlify/functions/products')
      .then(res => res.json())
      .then(products => {
        const msg = document.getElementById('message');
        const grid = document.getElementById('productGrid');

        if (products.length === 0) {
          msg.textContent = 'Aucun produit disponible pour le moment.';
          return;
        }

        msg.style.display = 'none';

        grid.innerHTML = products.map((p, idx) => {
          const hasSizes = p.sizes && p.sizes.length > 0;
          const hasGallery = p.images && p.images.length > 1;
          const first = hasSizes ? p.sizes[0] : null;
          const initialImg = hasSizes ? first.imageUrl : (hasGallery ? p.images[0] : p.imageUrl);
          const initialPrice = hasSizes ? first.price : p.price;

          const sizeButtons = hasSizes ? `
            <div class="size-selector">
              ${p.sizes.map((s, i) => `
                <button type="button" class="size-btn ${i === 0 ? 'active' : ''}"
                  onclick="selectSize(${idx}, ${i})">${s.label}</button>
              `).join('')}
            </div>
          ` : '';

          const carouselControls = hasGallery ? `
            <button type="button" class="carousel-arrow prev" onclick="event.stopPropagation(); shiftImage(${idx}, -1)">‹</button>
            <button type="button" class="carousel-arrow next" onclick="event.stopPropagation(); shiftImage(${idx}, 1)">›</button>
            <div class="carousel-dots">
              ${p.images.map((_, i) => `
                <span class="carousel-dot ${i === 0 ? 'active' : ''}" onclick="event.stopPropagation(); goToImage(${idx}, ${i})"></span>
              `).join('')}
            </div>
          ` : '';

          return `
          <div class="product-card">
           <div class="product-img" id="img-${idx}" style="position:relative;">
  ${initialImg 
    ? `<img src="${initialImg}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;">` 
    : '🕯️'}
  ${carouselControls}
</div>
            <div class="product-info">
              <h3 class="product-name">${p.name}</h3>
              <p class="product-desc">${p.description || 'Bougie artisanale marocaine'}</p>
              ${sizeButtons}
              <div class="product-footer">
                <span class="product-price" id="price-${idx}">${initialPrice} dh</span>
                <span class="product-stock ${p.stock <= 3 ? 'low' : ''}">
                  ${p.stock <= 3 ? '⚠️ ' : ''}Stock : ${p.stock}
                </span>
              </div>
            </div>
          </div>
        `;
        }).join('');

        window.productsData = products;
      })
      .catch(() => {
        document.getElementById('message').textContent = '⚠️ Impossible de charger les produits. Vérifiez que le serveur est démarré.';
      });

    window.carouselState = {};

    function renderCarouselImage(productIdx) {
      const product = window.productsData[productIdx];
      const state = window.carouselState[productIdx] || 0;
      const imgContainer = document.getElementById(`img-${productIdx}`);
      const existingImg = imgContainer.querySelector('img');
      if (existingImg) existingImg.src = product.images[state];

      const dots = imgContainer.querySelectorAll('.carousel-dot');
      dots.forEach((dot, i) => dot.classList.toggle('active', i === state));
    }

    function shiftImage(productIdx, direction) {
      const product = window.productsData[productIdx];
      const total = product.images.length;
      const current = window.carouselState[productIdx] || 0;
      window.carouselState[productIdx] = (current + direction + total) % total;
      renderCarouselImage(productIdx);
    }

    function goToImage(productIdx, imgIdx) {
      window.carouselState[productIdx] = imgIdx;
      renderCarouselImage(productIdx);
    }

    function selectSize(productIdx, sizeIdx) {
      const product = window.productsData[productIdx];
      const size = product.sizes[sizeIdx];

      document.getElementById(`img-${productIdx}`).innerHTML =
        `<img src="${size.imageUrl}" alt="${product.name}" style="width:100%;height:100%;object-fit:cover;">`;
      document.getElementById(`price-${productIdx}`).textContent = `${size.price} dh`;

      const card = document.getElementById(`img-${productIdx}`).closest('.product-card');
      card.querySelectorAll('.size-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === sizeIdx);
      });
    }
  </script>
</body>
</html>
